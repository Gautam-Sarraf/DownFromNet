services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: downfromnet_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TEMP_STORAGE_DIR=/tmp/universal_media_downloader
      - FILE_RETENTION_MINUTES=30
      - MAX_FILE_SIZE_BYTES=524288000
      - RATE_LIMIT_ANALYZE_PER_MINUTE=30
      - RATE_LIMIT_DOWNLOAD_PER_MINUTE=15
      - ALLOW_PRIVATE_IPS=false
    volumes:
      - temp_storage:/tmp/universal_media_downloader
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: downfromnet_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  temp_storage:
