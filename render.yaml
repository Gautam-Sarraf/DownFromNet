services:
  - type: web
    name: downfromnet-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PROJECT_NAME
        value: "Universal Media Downloader"
      - key: API_PREFIX
        value: "/api"
      - key: DEBUG
        value: "false"
      - key: TEMP_STORAGE_DIR
        value: "/tmp/universal_media_downloader"
      - key: FILE_RETENTION_MINUTES
        value: "30"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "60"
      - key: MAX_FILE_SIZE_BYTES
        value: "524288000"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "10"
      - key: RATE_LIMIT_ANALYZE_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_DOWNLOAD_PER_MINUTE
        value: "15"
      - key: ALLOW_PRIVATE_IPS
        value: "false"
